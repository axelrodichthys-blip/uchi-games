# main に push されるたびに Web 書き出しを行い、GitHub Pages に配置する。
# 事前に リポジトリの Settings → Pages → Source を「GitHub Actions」にしておくこと。
name: Web 書き出し → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot と Web 書き出しテンプレートを導入
        run: bash tools/cloud-setup.sh --godot-only

      - name: Web 書き出し
        run: bash tools/export-web.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
